name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  flutter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
      - name: Install FRB code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - name: Resolve Flutter dependencies (Windows)
        shell: pwsh
        run: ./scripts/setup-flutter-plugins.ps1
      - name: Generate FRB bindings
        working-directory: gui
        run: flutter_rust_bridge_codegen generate
      - name: Verify generated bindings
        run: |
          cargo fmt --all
          git diff --exit-code
      - name: Analyze and test widgets
        working-directory: gui
        run: |
          flutter analyze
          flutter test test
      - name: Build Windows
        working-directory: gui
        run: flutter build windows
